# Added for the Apple Music style fork (based on lyswhut/lx-music-mobile, Apache-2.0)
name: Build Apple Style APK

on:
  workflow_dispatch:
  push:
    branches:
      - apple-style

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Type check (report only)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build APK
        env:
          DISABLE_SVG: 1
          KS_B64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "使用仓库 Secrets 中的自有签名"
            echo "$KS_B64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_KEY_ALIAS="$KS_ALIAS" \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$KS_PASS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$KS_KEY_PASS"
            rm -f app/release.keystore
          else
            echo "未配置签名 Secrets，使用仓库自带的 debug.keystore 签名（仅供个人使用）"
            ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
              -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
              -PMYAPP_UPLOAD_STORE_PASSWORD=android \
              -PMYAPP_UPLOAD_KEY_PASSWORD=android
          fi

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          ls -lh *.apk
          md5sum *.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-apple-arm64-v8a
          path: android/app/build/outputs/apk/release/*-arm64-v8a.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-apple-universal
          path: android/app/build/outputs/apk/release/*-universal.apk
